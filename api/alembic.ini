# Alembic configuration for the StudyRAG API.
# All migration commands run from the repo root:
#   alembic -c api/alembic.ini upgrade head
#   alembic -c api/alembic.ini revision --autogenerate -m "..."
#
# sqlalchemy.url is intentionally empty — env.py reads DATABASE_URL from
# api/config.py (which honors .env via Pydantic Settings) so there's one
# place where the connection string is configured.

[alembic]
script_location = api/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
